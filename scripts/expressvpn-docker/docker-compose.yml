services:
  expressvpn:
    image: polkaned/expressvpn:latest
    container_name: expressvpn-proxy
    restart: unless-stopped
    environment:
      - ACTIVATION_CODE=${EXPRESSVPN_CODE}
      - REGION=${EXPRESSVPN_REGION:-smart}
      - PROTOCOL=${EXPRESSVPN_PROTOCOL:-lightway_udp}
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    ports:
      # SOCKS5 proxy port mapped to host
      - "127.0.0.1:1080:1080"
      # HTTP proxy port mapped to host (if privoxy enabled)
      - "127.0.0.1:8118:8118"
    stdin_open: true
    tty: true

  # Optional local SOCKS5 proxy server inside the ExpressVPN container network
  # This provides a 100% isolated SOCKS5 proxy interface for Nexload/Transfer Manager
  # without switching the Windows host gateway or interrupting IDE/WebSocket sessions!
  dante-socks:
    image: vimagick/dante:latest
    container_name: expressvpn-socks5
    restart: unless-stopped
    network_mode: "service:expressvpn"
    depends_on:
      - expressvpn
