[package]
name = "transfer-manager"
version = "0.1.0"
description = "MossDL: a download manager for files, file hosts and web pages"
authors = ["MossDL contributors"]
license = "GPL-3.0-or-later"
edition = "2021"
default-run = "transfer-manager"

[lib]
name = "transfer_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
tauri = { version = "2.8", features = ["tray-icon"] }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.2", default-features = false, features = ["rustls", "stream", "socks"] }
bytes = "1"
tokio = { version = "1.51.1", features = ["macros", "rt-multi-thread", "fs", "io-util", "sync", "time", "net"] }
sha2 = "0.10.9"
sha1 = "0.10.6"
md-5 = "0.10.6"
aes = "0.8.4"
ctr = "0.9.2"
futures-util = "0.3"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
tar = "0.4.46"
zip = { version = "0.6.6", default-features = false, features = ["deflate", "bzip2", "zstd"] }
sevenz-rust2 = "0.22.2"
fs2 = "0.4.3"
rfd = "0.15.4"
url = "2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_System_Console"] }
# Userspace WireGuard for per-route tunnels: boringtun is the protocol state
# machine only (no tun device, no sockets); smoltcp is the TCP/IP stack the
# tunnel's traffic runs on, so no driver or admin rights are needed.
boringtun = { version = "0.7.1", default-features = false }
smoltcp = { version = "0.14.0", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-tcp-cubic", "socket-udp", "socket-dns", "proto-dns"] }
base64 = "0.22"
# Brave's adblock engine (EasyList/uBO syntax). single-thread is off so one
# engine can serve the core's async tasks.
adblock = { version = "0.13.3", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

# `tauri dev` runs the debug transfer-core. Unoptimised, its AES-CTR (generic,
# so compiled in this crate) and TLS cap a MEGA/Transfer.it download at
# ~40 MB/s where release does ~360, so dev builds are optimised too.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
